services:
  db:
    image: mysql:8.0
    container_name: accounting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: accounting
      MYSQL_USER: ${DB_USERNAME:-account}
      MYSQL_PASSWORD: ${DB_PASSWORD:-account_pass}
    volumes:
      - accounting-mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ./backend
    container_name: accounting-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/accounting?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-account}
      DB_PASSWORD: ${DB_PASSWORD:-account_pass}
      SYNC_TOKEN_SECRET: ${SYNC_TOKEN_SECRET:-dev-only-change-me-12345678901234567890}
      JPA_DDL_AUTO: none
    ports:
      - "8080:8080"

volumes:
  accounting-mysql-data:
