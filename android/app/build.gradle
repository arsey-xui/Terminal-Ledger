plugins {
    id 'com.android.application'
}

// 读取签名配置（不存在则回退 debug 签名，便于本地验证）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 源代码统一按 UTF-8 编译，避免中文注释/字符串在非 UTF-8 系统上乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

android {
    namespace 'com.personal.accounting.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.accounting.android"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.3.0"
    }

    // ABI 打包策略：只打 arm64-v8a 一个包。
    // ML Kit 中文识别原生库四个 ABI 合计约 39MB（arm64 10.6 / v7a 6.5 / x86 11 / x86_64 11.1MB），
    // 现在的真机与 ARM64 模拟器都能跑 arm64-v8a；若以后要覆盖 32 位老机型，把 'armeabi-v7a' 加回 include 即可。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 无 keystore 时回退 debug 签名，保证打出的 release 包可安装
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'

    // 图表
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // 网络与 JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // 账单截图 OCR：ML Kit 端上中文文本识别（离线，不依赖 Google Play 服务联网下载模型）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
