server:
  port: 8080

spring:
  application:
    name: accounting-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/accounting?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      # 生产用 validate 并依赖 /sql/init.sql；开发可用 update 自动建表
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

accounting:
  sync:
    # 默认拉取窗口：最近 3 个月；null 表示不限
    pull-window-months: 3
    pull-page-size: 500
  token:
    # 同步令牌签名密钥（必须通过环境变量注入）
    secret: ${SYNC_TOKEN_SECRET:dev-only-secret-change-me}
    ttl-hours: 168
  ai:
    # AI 消费分析：留空 API Key 时走内置规则引擎
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  version:
    # 版本发布信息：手机端「设置 → 检查更新」读取这里
      latest: ${APP_LATEST_VERSION:1.1.1}
    min-supported: ${APP_MIN_SUPPORTED_VERSION:1.0.0}
    # 发布时填入安装包地址（例如 GitHub Releases 的 apk 链接）
    download-url: ${APP_DOWNLOAD_URL:}
    notes: ${APP_RELEASE_NOTES:}
    released-at: ${APP_RELEASED_AT:0}
    # GitHub Releases 自动获取：填了 github-repo 就优先查 GitHub（官方 API），
    # 发版只需在 GitHub 创建 Release 并上传产物，不用改这里的配置
    github-repo: ${APP_GITHUB_REPO:}
    # 私有仓库或想提高速率限制时填 Token（公开仓库可留空）
    github-token: ${APP_GITHUB_TOKEN:}
    # 资产名匹配规则：apk 按架构片段、桌面端 zip 按 Desktop 字样，匹配到就自动生成下载地址
    apk-asset-pattern: ${APP_APK_ASSET_PATTERN:arm64-v8a}
    desktop-asset-pattern: ${APP_DESKTOP_ASSET_PATTERN:Desktop}
    # GitHub 结果缓存秒数（未鉴权 API 限制 60 次/小时，缓存可避免被客户端打爆）
    cache-seconds: ${APP_VERSION_CACHE_SECONDS:300}

logging:
  level:
    root: INFO
    com.personal.accounting: DEBUG
